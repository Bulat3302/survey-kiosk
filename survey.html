<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --border: #dde3ec;
    --text: #0f172a; --muted: #64748b;
    --accent: #4f46e5; --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .card {
    max-width: 680px;
    margin: 24px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  #description { color: var(--muted); margin-bottom: 18px; white-space: pre-line; }
  fieldset { border: 0; margin-bottom: 22px; }
  legend { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .help { font-size: 13px; color: var(--muted); margin-bottom: 10px; white-space: pre-line; }
  textarea, input[type="text"], input[type="tel"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 15px;
  }
  textarea { min-height: 90px; resize: vertical; }
  textarea:focus, input[type="text"]:focus, input[type="tel"]:focus {
    outline: 2px solid var(--accent); border-color: transparent;
  }
  .date-row { display: flex; gap: 10px; }
  .date-row input { flex: 1; }

  /* Варианты ответа */
  .opt {    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .opt-text { font-size: 15px; }
  .other-input { margin: 4px 0 10px 0; display: none; }
  .other-input.visible { display: block; }

  /* Вложения к вопросам и картинки вариантов */
  .q-image {
    display: block; max-width: 100%; height: auto;
    margin: 6px 0 14px; border-radius: 10px; border: 1px solid var(--border);
  }
  .q-file {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 4px 0 14px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; color: var(--accent); text-decoration: none;
    word-break: break-all;
  }
  .q-file:hover { background: var(--accent-soft); }
  .opt-image {
    display: block; max-width: 140px; height: auto;
    margin-top: 6px; border-radius: 8px; border: 1px solid var(--border);
  }

  /* Шкала звёздами (как на платформе) */
  .scale-hint { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .scale-stars { display: flex; gap: 2px; margin: 2px 0 8px; }
  .star {
    background: none; border: 0; padding: 6px; margin: 0;
    line-height: 0; cursor: pointer;
    transition: transform .12s ease;
  }
  .star svg { fill: rgba(91, 94, 118, .09); stroke: #c3c7d6; stroke-width: 2; }
  .star:hover svg { stroke: var(--accent); }
  .star.star-on svg { fill: var(--accent); stroke: var(--accent); }
  .star:active { transform: scale(0.94); }

  /* Шкала */
  .scale { display: flex; gap: 8px; flex-wrap: wrap; }
  .scale label {
    min-width: 48px; height: 48px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 16px; font-weight: 600;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .scale label:hover { border-color: var(--accent); }
  .scale input { position: absolute; opacity: 0; pointer-events: none; }
  .scale input:checked + span { color: #fff; }
  .scale label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .scale span { pointer-events: none; }

  .unsupported {
    padding: 12px; border-radius: 10px;
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 14px;
  }

  .consent {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: var(--muted); margin-bottom: 18px;
  }
  .consent input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); }
  button[type="submit"] {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px;
    cursor: pointer; transition: background 0.15s ease;
  }
  button[type="submit"]:hover { background: var(--accent-hover); }
  button[type="submit"]:disabled { background: #a5b4fc; cursor: default; }

  #thanks { text-align: center; padding: 24px 0; }
  #thanks .emoji { font-size: 44px; }
  #thanks h2 { font-size: 24px; margin: 12px 0 8px; }
  #thanks p { color: var(--muted); }
  #error {
    margin-top: 14px; padding: 10px 12px;
    background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
    color: #b91c1c; font-size: 14px; white-space: pre-line;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Загрузка опроса…</h1>
    <p id="description"></p>
    <form id="form" novalidate>
      <div id="questions"></div>
      <label class="consent">
        <input type="checkbox" id="consent">
        Нажимая кнопку «Отправить», я даю своё согласие на обработку моих персональных данных в соответствии с условиями обработки персональных данных
      </label>
      <button type="submit" id="submit">Отправить</button>
      <p id="error" hidden></p>
    </form>
    <div id="thanks" hidden>
      <div class="emoji">🎉</div>
      <h2 id="confirm-msg">Ваш ответ записан</h2>
      <p>Сейчас форма обновится для следующего участника…</p>
    </div>
  </div>

  <script src="js/wakelock.js?v=20261110"></script>
  <script>
    (function () {
      "use strict";

      var formEl = document.getElementById("form");
      var questionsEl = document.getElementById("questions");
      var thanksEl = document.getElementById("thanks");
      var errorEl = document.getElementById("error");
      var submitBtn = document.getElementById("submit");
      var definition = null;
      var unsupportedCount = 0;

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // Видимые и доступные варианты (как на платформе)
      function visibleChoices(q) {
        return (q.choices || []).filter(function (c) {
          return c && c.is_available !== false && c.is_visible !== false;
        });
      }

      // Вложение к вопросу: картинка (media) или ссылка на файл (document)
      var IMAGE_RE = /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i;

      // Иконка звезды — тот же контур, что на платформе (Lucide "star")
      var STAR_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"' +
        ' fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
        ' stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31' +
        ' 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123' +
        ' 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973' +
        ' 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53' +
        ' 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>';

      function fileName(url) {
        try {
          return decodeURIComponent(String(url).split("/").pop().split("?")[0]);
        } catch (e) {
          return "файл";
        }
      }

      function attachmentNode(url, type, imageClass) {
        var looksImage = type === "media" || IMAGE_RE.test(String(url || ""));
        if (looksImage) {
          var img = el("img", imageClass || "q-image");
          img.src = url;
          img.alt = "Изображение к вопросу";
          img.loading = "lazy";
          img.onerror = function () {
            // Если картинка не открылась — показываем хотя бы ссылку
            var link = el("a", "q-file", "Открыть изображение");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";
            if (img.parentNode) img.parentNode.replaceChild(link, img);
          };
          return img;
        }
        var a = el("a", "q-file", "📎 " + fileName(url));
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.download = "";
        return a;
      }

      function textField(q) {
        var area = el("textarea");
        area.name = "q-" + q.id;
        if (q.max_characters) area.maxLength = q.max_characters;
        area.placeholder = "Введите ответ";
        return area;
      }

      /* ---------- Маски ввода даты и времени ---------- */

      function digitsOnly(v) {
        return String(v || "").replace(/\D/g, "");
      }

      function pad2(n) {
        return (n < 10 ? "0" : "") + n;
      }

      // дд.мм.гггг: точки ставятся сами, день <= 31, месяц <= 12
      function formatDateMask(raw) {
        var d = digitsOnly(raw).slice(0, 8);
        var day = d.slice(0, 2);
        var mon = d.slice(2, 4);
        var year = d.slice(4, 8);

        if (day.length === 1 && Number(day) > 3) day = "0" + day;
        if (day.length === 2) day = pad2(Math.min(31, Number(day)));
        if (mon.length === 1 && Number(mon) > 1) mon = "0" + mon;
        if (mon.length === 2) mon = pad2(Math.min(12, Number(mon)));

        var out = day;
        if (mon || d.length > 2) out += "." + mon;
        if (year || d.length > 4) out += "." + year;
        return out;
      }

      // чч.мм: точка ставится сама, часы <= 23, минуты <= 59
      function formatTimeMask(raw) {
        var d = digitsOnly(raw).slice(0, 4);
        var hh = d.slice(0, 2);
        var mm = d.slice(2, 4);

        if (hh.length === 1 && Number(hh) > 2) hh = "0" + hh;
        if (hh.length === 2) hh = pad2(Math.min(23, Number(hh)));
        if (mm.length === 1 && Number(mm) > 5) mm = "0" + mm;
        if (mm.length === 2) mm = pad2(Math.min(59, Number(mm)));

        var out = hh;
        if (mm || d.length > 2) out += "." + mm;
        return out;
      }

      function attachMask(input, formatter) {
        input.addEventListener("input", function () {
          var formatted = formatter(input.value);
          if (input.value !== formatted) {
            input.value = formatted;
          }
        });
        input.addEventListener("blur", function () {
          input.value = formatter(input.value);
        });
      }

      var DATE_RE = /^(\d{2})\.(\d{2})\.(\d{4})$/;
      var TIME_RE = /^(\d{2})\.(\d{2})$/;

      function isValidDate(value) {
        var m = DATE_RE.exec(value || "");
        if (!m) return false;
        var day = Number(m[1]);
        var mon = Number(m[2]);
        var year = Number(m[3]);
        if (mon < 1 || mon > 12 || day < 1 || day > 31) return false;
        var dt = new Date(year, mon - 1, day);
        return dt.getFullYear() === year && dt.getMonth() === mon - 1 && dt.getDate() === day;
      }

      function isValidTime(value) {
        var m = TIME_RE.exec(value || "");
        if (!m) return false;
        return Number(m[1]) < 24 && Number(m[2]) < 60;
      }

      function numberField(q) {
        var input = el("input");
        input.type = "text";
        input.inputMode = "numeric";
        input.name = "q-" + q.id;
        input.placeholder = "Введите число";
        return input;
      }

      function dateFields(q, wrap) {
        var isRange = q.date_format === "range" || q.date_format === "range_date";
        var row = el("div", "date-row");
        var from = el("input");
        from.type = "text";
        from.name = "q-" + q.id + "-from";
        from.placeholder = isRange ? "ДД.ММ.ГГГГ (с)" : "ДД.ММ.ГГГГ";
        from.setAttribute("inputmode", "numeric");
        from.setAttribute("maxlength", "10");
        attachMask(from, formatDateMask);
        row.appendChild(from);
        if (isRange) {
          var to = el("input");
          to.type = "text";
          to.name = "q-" + q.id + "-to";
          to.placeholder = "ДД.ММ.ГГГГ (по)";
          to.setAttribute("inputmode", "numeric");
          to.setAttribute("maxlength", "10");
          attachMask(to, formatDateMask);
          row.appendChild(to);
        }
        wrap.appendChild(row);

        // Время, если форма его требует (вводим через точку, отправляем через двоеточие)
        if (q.time_format && q.time_format !== "none") {
          var timeRange = q.time_format === "range";
          var trow = el("div", "date-row");
          var tfrom = el("input");
          tfrom.type = "text";
          tfrom.name = "q-" + q.id + "-time-from";
          tfrom.placeholder = timeRange ? "ЧЧ.ММ (с)" : "ЧЧ.ММ";
          tfrom.setAttribute("inputmode", "numeric");
          tfrom.setAttribute("maxlength", "5");
          attachMask(tfrom, formatTimeMask);
          trow.appendChild(tfrom);
          if (timeRange) {
            var tto = el("input");
            tto.type = "text";
            tto.name = "q-" + q.id + "-time-to";
            tto.placeholder = "ЧЧ.ММ (по)";
            tto.setAttribute("inputmode", "numeric");
            tto.setAttribute("maxlength", "5");
            attachMask(tto, formatTimeMask);
            trow.appendChild(tto);
          }
          wrap.appendChild(trow);
        }
      }

      // Одиночный / множественный выбор (+ «Другое»)
      function choiceFields(q, wrap) {
        var multiple = q.question_type === "multiple_choice";
        var choices = visibleChoices(q);
        var name = "q-" + q.id + "-choice";
        var otherId = "q-" + q.id + "-other";
        var otherTextId = "q-" + q.id + "-other-text";

        var inputs = [];
        choices.forEach(function (c) {
          var label = el("label", "opt");
          var input = el("input");
          input.type = multiple ? "checkbox" : "radio";
          input.name = multiple ? name : name;
          input.value = String(c.id);
          label.appendChild(input);
          label.appendChild(el("span", "opt-text", c.text));
          if (c.image) label.appendChild(attachmentNode(c.image, "media", "opt-image"));
          wrap.appendChild(label);
          inputs.push(input);
        });

        var otherInput = null;
        var otherText = null;
        if (q.allow_other) {
          var otherLabel = el("label", "opt");
          otherInput = el("input");
          otherInput.type = "checkbox";
          otherInput.name = otherId;
          otherInput.value = "__other__";
          otherLabel.appendChild(otherInput);
          otherLabel.appendChild(el("span", "opt-text", "Другое"));
          wrap.appendChild(otherLabel);

          otherText = el("input");
          otherText.type = "text";
          otherText.className = "other-input";
          otherText.name = otherTextId;
          otherText.placeholder = "Укажите свой вариант";
          wrap.appendChild(otherText);

          // «Другое» — эксклюзивный вариант
          otherInput.addEventListener("change", function () {
            if (otherInput.checked) {
              inputs.forEach(function (i) { i.checked = false; });
              otherText.classList.add("visible");
            } else {
              otherText.classList.remove("visible");
            }
          });
          inputs.forEach(function (i) {
            i.addEventListener("change", function () {
              if (i.checked) {
                otherInput.checked = false;
                otherText.classList.remove("visible");
              }
            });
          });
        }
        return { multiple: multiple, inputs: inputs, otherInput: otherInput, otherText: otherText };
      }

      // Шкала: как на платформе — первый вариант служит «нулём»,
      // звёзды рисуются для остальных вариантов.
      function scaleFields(q, wrap) {
        var choices = visibleChoices(q);
        var hasZero = choices.length > 1;
        var zero = hasZero ? choices[0] : null;
        var stars = hasZero ? choices.slice(1) : choices;
        var buttons = [];

        wrap.dataset.scaleValue = "0";
        wrap.dataset.scaleTouched = "0";
        wrap.dataset.scaleZeroId = zero ? String(zero.id) : "";

        function paint() {
          var value = Number(wrap.dataset.scaleValue || 0);
          buttons.forEach(function (btn, i) {
            var on = i < value;
            if (on) {
              btn.classList.add("star-on");
            } else {
              btn.classList.remove("star-on");
            }
            btn.setAttribute("aria-pressed", on ? "true" : "false");
          });
        }

        wrap.appendChild(el("p", "scale-hint", "Нажмите выбранную звезду ещё раз, чтобы установить 0."));

        var group = el("div", "scale-stars");
        group.setAttribute("role", "group");
        group.setAttribute("aria-label", "Оценка");

        stars.forEach(function (c, i) {
          var btn = el("button");
          btn.type = "button";
          btn.className = "star";
          btn.dataset.id = String(c.id);
          btn.setAttribute("aria-label", "Оценка " + (i + 1));
          btn.innerHTML = STAR_SVG;
          btn.addEventListener("click", function () {
            var current = Number(wrap.dataset.scaleValue || 0);
            // Повторный клик по выбранной звезде сбрасывает оценку в 0
            wrap.dataset.scaleValue = String(current === i + 1 ? 0 : i + 1);
            wrap.dataset.scaleTouched = "1";
            paint();
          });
          group.appendChild(btn);
          buttons.push(btn);
        });

        wrap.appendChild(group);
        paint();
      }

      function renderQuestion(q, idx) {
        var wrap = el("fieldset");
        wrap.dataset.qid = q.id;
        wrap.dataset.qtype = q.question_type;
        wrap.appendChild(el("legend", "", idx + 1 + ". " + q.title));
        if (q.help_text) wrap.appendChild(el("p", "help", q.help_text));
        if (q.file) wrap.appendChild(attachmentNode(q.file, q.file_type, "q-image"));

        var type = q.question_type;
        if (type === "text") {
          wrap.appendChild(textField(q));
        } else if (type === "number") {
          wrap.appendChild(numberField(q));
        } else if (type === "date") {
          dateFields(q, wrap);
        } else if (type === "one_choice" || type === "multiple_choice") {
          choiceFields(q, wrap);
        } else if (type === "scale") {
          scaleFields(q, wrap);
        } else {
          // Неизвестный нам тип (файл, сопоставление, последовательность…)
          unsupportedCount += 1;
          wrap.appendChild(
            el("div", "unsupported",
              "Вопрос этого типа в нашей форме не поддерживается. " +
              "Пройти опрос целиком можно с телефона по QR-коду справа.")
          );
        }
        questionsEl.appendChild(wrap);
      }

      function shownQuestions() {
        return definition && definition.questions ? definition.questions : [];
      }

      function buildAnswers() {
        var answers = [];
        shownQuestions().forEach(function (q) {
          var base = {
            question: q.id,
            choices: [],
            text_answer: "",
            other_answer: null,
            match_answer: {}
          };
          var type = q.question_type;

          if (type === "date") {
            base.date_from = valueOf("q-" + q.id + "-from");
            base.date_to = valueOf("q-" + q.id + "-to");
            // Вводим время через точку (чч.мм), платформа принимает только HH:MM
            base.time_from = timeToPayload(valueOf("q-" + q.id + "-time-from"));
            base.time_to = timeToPayload(valueOf("q-" + q.id + "-time-to"));
          } else if (type === "one_choice" || type === "multiple_choice") {
            var checked = formEl.querySelectorAll('input[name="q-' + q.id + '-choice"]:checked');
            Array.prototype.forEach.call(checked, function (i) {
              base.choices.push(Number(i.value));
            });
            var other = formEl.elements["q-" + q.id + "-other"];
            var otherText = formEl.elements["q-" + q.id + "-other-text"];
            if (other && other.checked) {
              base.choices = [];
              base.other_answer = (otherText && otherText.value.trim()) || "";
            }
          } else if (type === "scale") {
            var fs = formEl.querySelector('fieldset[data-qid="' + q.id + '"]');
            var value = fs ? Number(fs.dataset.scaleValue || 0) : 0;
            var touched = fs && fs.dataset.scaleTouched === "1";
            var visible = visibleChoices(q);
            var hasZero = visible.length > 1;
            var starChoices = hasZero ? visible.slice(1) : visible;
            if (value > 0 && starChoices[value - 1]) {
              base.choices.push(Number(starChoices[value - 1].id));
            } else if (touched && hasZero) {
              // Явно выставленный 0 — это первый вариант шкалы
              base.choices.push(Number(visible[0].id));
            }
          } else if (type === "text" || type === "number") {
            base.text_answer = valueOf("q-" + q.id);
          }
          // Неизвестные типы отправляем как есть (пустыми) — платформа отклонит,
          // если вопрос обязательный; пользователь увидит её текст ошибки.
          answers.push(base);
        });
        return answers;
      }

      function valueOf(name) {
        var field = formEl.elements[name];
        if (!field) return null;
        var v = (field.value || "").trim();
        return v === "" ? null : v;
      }

      // чч.мм -> HH:MM (формат платформы)
      function timeToPayload(value) {
        if (!value) return null;
        return String(value).replace(/\./g, ":");
      }

      // Проверка обязательных полей до отправки
      function validate() {
        var problems = [];
        shownQuestions().forEach(function (q) {
          if (!q.is_required) return;
          var type = q.question_type;
          if (type === "text" || type === "number") {
            if (!valueOf("q-" + q.id)) problems.push("«" + q.title + "» — введите ответ");
          } else if (type === "date") {
            var dateFrom = valueOf("q-" + q.id + "-from");
            var dateTo = valueOf("q-" + q.id + "-to");
            var isRange = q.date_format === "range";
            if (!dateFrom) {
              problems.push("«" + q.title + "» — укажите дату");
            } else if (!isValidDate(dateFrom)) {
              problems.push("«" + q.title + "» — дата должна быть в формате ДД.ММ.ГГГГ");
            }
            if (isRange) {
              if (!dateTo) {
                problems.push("«" + q.title + "» — укажите дату окончания");
              } else if (!isValidDate(dateTo)) {
                problems.push("«" + q.title + "» — дата окончания в формате ДД.ММ.ГГГГ");
              }
            }
            if (q.time_format && q.time_format !== "none") {
              var timeFrom = valueOf("q-" + q.id + "-time-from");
              var timeTo = valueOf("q-" + q.id + "-time-to");
              if (q.time_format === "range") {
                if (!timeFrom || !isValidTime(timeFrom)) {
                  problems.push("«" + q.title + "» — время начала в формате ЧЧ.ММ");
                }
                if (!timeTo || !isValidTime(timeTo)) {
                  problems.push("«" + q.title + "» — время окончания в формате ЧЧ.ММ");
                }
              } else if (!timeFrom || !isValidTime(timeFrom)) {
                problems.push("«" + q.title + "» — время в формате ЧЧ.ММ");
              }
            }
          } else if (type === "one_choice" || type === "multiple_choice") {
            var checked = formEl.querySelectorAll('input[name="q-' + q.id + '-choice"]:checked').length;
            var other = formEl.elements["q-" + q.id + "-other"];
            var otherText = formEl.elements["q-" + q.id + "-other-text"];
            var otherOk = other && other.checked && otherText && otherText.value.trim();
            if (checked === 0 && !otherOk) problems.push("«" + q.title + "» — выберите вариант");
          } else if (type === "scale") {
            var scaleFs = formEl.querySelector('fieldset[data-qid="' + q.id + '"]');
            var scaleValue = scaleFs ? Number(scaleFs.dataset.scaleValue || 0) : 0;
            var scaleTouched = scaleFs && scaleFs.dataset.scaleTouched === "1";
            if (scaleValue === 0 && !scaleTouched) {
              problems.push("«" + q.title + "» — выберите оценку");
            }
          } else if (type === "text" || type === "number") {
            /* уже обработано */
          }
        });
        if (!document.getElementById("consent").checked) {
          problems.push("Отметьте согласие на обработку персональных данных");
        }
        return problems;
      }

      function showError(text) {
        errorEl.textContent = text;
        errorEl.hidden = false;
      }

      fetch("api/form")
        .then(function (r) { return r.json(); })
        .then(function (def) {
          definition = def;
          document.title = def.title || "Опрос";
          document.getElementById("title").textContent = def.title || "Опрос";
          document.getElementById("description").textContent = def.description || "";
          (def.questions || []).forEach(renderQuestion);
        })
        .catch(function () {
          document.getElementById("title").textContent = "Не удалось загрузить опрос";
          submitBtn.disabled = true;
        });

      formEl.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!definition) return;
        errorEl.hidden = true;

        var problems = validate();
        if (problems.length) {
          showError(problems.join("\n"));
          return;
        }

        submitBtn.disabled = true;

        fetch("api/form-submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answers: buildAnswers() }),
        })
          .then(function (r) {
            return r.json().then(function (body) { return { status: r.status, body: body }; });
          })
          .then(function (res) {
            if (res.status >= 200 && res.status < 300) {
              formEl.hidden = true;
              document.getElementById("confirm-msg").textContent =
                definition.confirmation_message || "Ваш ответ записан";
              thanksEl.hidden = false;
              setTimeout(function () {
                if (window.self !== window.top) {
                  window.location.reload();
                } else {
                  window.close();
                  setTimeout(function () { window.location.href = "/"; }, 300);
                }
              }, 2500);
            } else {
              var err = "Ошибка отправки";
              if (res.body && res.body.error) {
                err = res.body.error.message || JSON.stringify(res.body.error);
                if (res.body.error.errors) {
                  var details = res.body.error.errors;
                  err += ": " + (typeof details === "string" ? details : JSON.stringify(details));
                }
              }
              showError(err);
              submitBtn.disabled = false;
            }
          })
          .catch(function () {
            showError("Нет связи с сервером — попробуйте ещё раз.");
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
