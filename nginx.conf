server {
    listen 80;
    listen [::]:80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Приём ответов от сервиса опросов (вебхук) — прокси на сервис api
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
        # Стойка всегда должна отдавать свежие файлы после пересборки
        add_header Cache-Control "no-cache";
    }
}
